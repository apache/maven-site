name: Verify Site

on:
  pull_request:
  # master saves the Maven cache that pull requests restore; a pull request can only read its own and master's
  push:
    branches: [master]

# allow single build per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # don't change the name without updating the .asf.yaml
    name: Verify and build Maven Site
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'
          cache-jdk: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Maven
        run:
          mvn --errors --batch-mode --no-transfer-progress --show-version org.apache.maven.plugins:maven-wrapper-plugin:3.3.3:wrapper "-Dmaven=3.9.11"

      - name: Verify and build Maven Site
        run: ./mvnw --errors --batch-mode --no-transfer-progress --show-version verify site

      - name: Upload Maven Site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.number || github.ref_name }}-${{ github.run_number }}-site
          path: |
            target/site/**
