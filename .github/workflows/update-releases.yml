name: Update Maven Release Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: update-release-metadata
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Check for a pending update pull request
        id: pending-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-release-metadata
        run: |
          pr_count="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${BRANCH}" \
            --json number \
            --jq 'length')"

          if [[ "${pr_count}" == "0" ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update Maven release metadata
        if: steps.pending-pr.outputs.exists == 'false'
        run: mvn --batch-mode --errors --no-transfer-progress package -P update

      - name: Create pull request when files changed
        if: steps.pending-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-release-metadata
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add --update

          if git diff --cached --quiet; then
            echo "No release metadata changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${BRANCH}"
          git commit -m "Update Maven release metadata"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease --set-upstream origin "${BRANCH}"

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH}" \
            --title "Update Maven release metadata" \
            --body "Automated update generated by \`mvn package -P update\`."
